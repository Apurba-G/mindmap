<div class="password-strength-container" *ngIf="password">
  <div class="strength-header">
    <span class="label-text">Password strength:</span>
    <span class="strength-tag" [ngClass]="'tag-' + strengthColor">{{ strengthLabel }}</span>
  </div>

  <mat-progress-bar
    class="strength-bar"
    mode="determinate"
    [value]="progressValue"
    [color]="strengthColor">
  </mat-progress-bar>

  <div class="hints-list" *ngIf="hints.length > 0">
    <span class="hint-item" *ngFor="let hint of hints">
      • Need {{ hint }}
    </span>
  </div>
</div>
