server:
  port: 8082
  servlet:
    context-path: /api/v1

spring:
  application:
    name: assessment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mindmap_assessment?currentSchema=assessment_schema}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      schema: assessment_schema

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: assessment_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
    show-sql: false

  flyway:
    enabled: true
    schemas: assessment_schema
    default-schema: assessment_schema
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
      retries: 3
    topics:
      assessment-completed: assessment.completed

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  issuer: mindmap-auth-service

app:
  encryption:
    secret-key: ${ASSESSMENT_ENCRYPTION_KEY:MySuperSecretAssessmentKey2026!} # 32-byte key for AES-256
  safety:
    helpline-numbers:
      - "US/Canada: 988 (Suicide & Crisis Lifeline)"
      - "UK: 111 (NHS Mental Health Services) or 116 123 (Samaritans)"
      - "International: https://findahelpline.com"
      - "Crisis Text Line: Text HOME to 741741"
    alert-message: "We noticed your response may reflect some difficult feelings. You're not alone. If you need support, please reach out to the crisis resources listed below. This information has been noted confidentially."

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
