server:
  port: 8761

spring:
  application:
    name: eureka-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Disable self-preservation in dev for fast eviction of downed services.
    # In production, set enable-self-preservation: true
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    eviction-interval-timer-in-ms: 5000
    # How often to renew. Faster in dev for quicker registration.
    renewal-threshold-update-interval-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    com.mindmap.eureka: DEBUG

---
# Docker profile — override hostname for container networking
spring:
  config:
    activate:
      on-profile: docker
eureka:
  instance:
    hostname: eureka-server
    prefer-ip-address: true
